[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrepocoach"
version = "0.4.2"
description = "Score your codebase on how ready it is for AI agents — and coach you through the fixes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "WouterDeBot" },
]
keywords = [
    "ai-agents",
    "codebase-health",
    "code-quality",
    "static-analysis",
    "developer-tools",
    "github-action",
    "cli",
    "score",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Documentation",
]
# Zero runtime dependencies — uses stdlib only (including tomllib, which
# shipped in Python 3.11). This is a hard supply-chain-trust constraint.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
]

[project.scripts]
agentrepocoach = "agentrepocoach.cli:main"

[project.urls]
Homepage = "https://github.com/WouterDeBot/agentrepocoach"
Source = "https://github.com/WouterDeBot/agentrepocoach"
Issues = "https://github.com/WouterDeBot/agentrepocoach/issues"
Documentation = "https://WouterDeBot.github.io/agentrepocoach"
Changelog = "https://github.com/WouterDeBot/agentrepocoach/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Never collect files under tests/fixtures/ — those are synthetic sample repos
# used AS INPUT to the tool, not Python tests themselves.
norecursedirs = ["fixtures", ".git", "dist", "build"]
